[project]
name = "bookshelf"
version = "0.0.1"
description = "Online library with OPDS support"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "crispy-bootstrap5>=2025.6",
    "cryptography>=46.0.5",
    "django>=6.0.3",
    "django-allauth>=65.14.3",
    "django-celery-beat>=2.9.0",
    "django-celery-results>=2.6.0",
    "django-crispy-forms>=2.5",
    "django-environ>=0.13.0",
    "django-imagekit>=6.1.0",
    "djangorestframework>=3.16.1",
    "ebooklib>=0.20",
    "gunicorn>=25.1.0",
    "pillow>=12.1.1",
    "psycopg2>=2.9.11",
    "pyjwt>=2.11.0",
    "pyzipper>=0.3.6",
    "redis>=7.4.0",
    "requests>=2.32.5",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "coverage>=7.13.4",
    "django-debug-toolbar>=6.2.0",
    "django-extensions",
    "ipython>=9.11.0",
    "parameterized>=0.9.0",
]
