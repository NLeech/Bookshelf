services:
  web:
    build: .
    image: leechlab/bookshelf:latest
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: curl -f http://localhost:8080/ping/ || exit 1
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    env_file:
      - .env_
    environment:
      - PG_DATABASE_ADDRESS=db
      - IS_DOCKER=true
    volumes:
      - "staticfiles:/Bookshelf/bookshelf/static"
      - "media:/Bookshelf/bookshelf/media"
    ports:
      - "8082:8080"
    networks:
      - front-tier
      - back-tier
    restart: "unless-stopped"

  db:
    build: postgres
    image:  leechlab/bookshelf_db:latest
    env_file:
      - .env_
    volumes:
      - "db-data:/var/lib/postgresql/data"
    healthcheck:
      test: bash /healthchecks/postgres.sh
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - back-tier
    restart: "unless-stopped"

volumes:
  staticfiles:
  media:
  db-data:

networks:
  front-tier:
  back-tier:
    internal: true
