services:
  test_db:
    build: postgres
    image:  leechlab/bookshelf_db:latest
    env_file:
      - .env_
    volumes:
      - "test_db-data:/var/lib/postgresql/data"
    healthcheck:
      test: bash /healthchecks/postgres.sh
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    ports:
      - "5432:5432"
    networks:
      - test-front-tier
    restart: "unless-stopped"

  test_broker:
    image: redis:8.6.2-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    ports:
      - "6379:6379"
    networks:
      - test-front-tier
    volumes:
      - "test_broker-data:/data"
    restart: "unless-stopped"

volumes:
  test_db-data:
  test_broker-data:

networks:
  test-front-tier:
