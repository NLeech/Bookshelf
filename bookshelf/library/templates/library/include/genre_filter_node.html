{% for node in nodes %}
    <div class="genre-item ms-3">
        <div class="form-check">
            <input class="form-check-input genre-checkbox" 
                   type="checkbox" 
                   name="genre" 
                   value="{{ node.genre.code }}" 
                   id="genre-{{ node.genre.code }}"
                   {% if node.genre.code in selected_genres %}checked{% endif %}
                   onchange="toggleChildren(this)">
            <label class="form-check-label small" for="genre-{{ node.genre.code }}">
                {{ node.genre.name }} 
                {% if node.book_count > 0 %}
                    <span class="text-muted">({{ node.book_count }})</span>
                {% endif %}
            </label>
        </div>
        {% if node.children %}
            <div class="genre-children">
                {% include "library/include/genre_filter_node.html" with nodes=node.children %}
            </div>
        {% endif %}
    </div>
{% endfor %}

{% if forloop.first %}
<script>
    function toggleChildren(parentCheckbox) {
        const container = parentCheckbox.closest('.genre-item');
        
        // 1. Check/Uncheck all descendants
        const childCheckboxes = container.querySelectorAll('.genre-children .genre-checkbox');
        childCheckboxes.forEach(cb => {
            cb.checked = parentCheckbox.checked;
        });

        // 2. If unchecked, uncheck all ancestors
        if (!parentCheckbox.checked) {
            let current = container;
            while (current) {
                const parentItem = current.parentElement.closest('.genre-item');
                if (!parentItem) break;
                
                const parentCheckboxInput = parentItem.querySelector(':scope > .form-check > .genre-checkbox');
                if (parentCheckboxInput) {
                    parentCheckboxInput.checked = false;
                }
                current = parentItem;
            }
        }
    }
</script>
{% endif %}
