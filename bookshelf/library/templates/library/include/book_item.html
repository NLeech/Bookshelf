<div class="card mb-3 border-0 border-bottom rounded-0 pb-3">
    <div class="row g-0">
        <div class="col-auto pe-3">
            {% if book.cover %}
                <img src="{{ book.cover_preview.url }}" class="img-fluid rounded shadow-sm" alt="{{ book.title }} Cover" width="100" height="150" style="object-fit: cover;">
            {% else %}
                <div class="bg-light rounded shadow-sm d-flex align-items-center justify-content-center" style="width: 100px; height: 150px;">
                    <i class="bi bi-book text-secondary fs-1"></i>
                </div>
            {% endif %}
        </div>
        <div class="col d-flex flex-column">
            <p class="card-text text-muted small mb-2">Added: {{ book.created_at|date:"Y-m-d" }}</p>
            <div class="description-truncate small text-secondary mb-1" id="desc-{{ book.id }}">
                {{ book.description|safe }}
            </div>
            
            <div class="mt-auto d-flex justify-content-between align-items-center">
                <div>
                    <a href="#" class="text-decoration-none fw-medium me-3"><i class="bi bi-download"></i> EPUB</a>
                    <a href="#" class="text-decoration-none fw-medium"><i class="bi bi-download"></i> FB2</a>
                </div>
                <button class="btn btn-link btn-sm p-0 expand-btn text-decoration-none"
                        type="button"
                        onclick="toggleDescription(this, 'desc-{{ book.id }}')">
                    Show more
                </button>
            </div>
        </div>
    </div>
</div>
