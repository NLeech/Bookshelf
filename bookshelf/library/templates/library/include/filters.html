<form id="filter-form" 
      hx-get="{{ hx_url }}" 
      hx-trigger="change" 
      hx-target="{{ hx_target }}" 
      hx-swap="innerHTML"
      hx-push-url="true">
    
    {% if active_tab %}
        <input type="hidden" name="tab" id="active-tab-input" value="{{ active_tab }}">
    {% endif %}

    <div class="mb-4">
        <h6 class="border-bottom pb-1">Languages</h6>
        {% for lang in available_languages %}
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="lang" value="{{ lang.code }}" id="lang-{{ lang.code }}"
                       {% if lang.code in selected_langs %}checked{% endif %}>
                <label class="form-check-label small" for="lang-{{ lang.code }}">
                    {{ lang.name }} <span class="text-muted">({{ lang.book_count }})</span>
                </label>
            </div>
        {% empty %}
            <p class="text-muted small">No languages found.</p>
        {% endfor %}
    </div>

    <div class="mb-4">
        <h6 class="border-bottom pb-1">Genres</h6>
        <div class="genre-tree-container" style="max-height: 400px; overflow-y: auto;">
            {% include "library/include/genre_filter_node.html" with nodes=available_genres_tree %}
        </div>
    </div>
</form>
