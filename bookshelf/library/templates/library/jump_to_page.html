<div class="modal fade" id="jumpToPageModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <form hx-get="{% url 'library:authors_list' %}" 
                  hx-target="#authors_list" 
                  hx-swap="innerHTML"
                  hx-on::after-request="bootstrap.Modal.getInstance(document.getElementById('jumpToPageModal')).hide()">
                {% csrf_token %}
                <input type="hidden" name="filter" value="{{ filter }}">
                <div class="modal-header">
                    <h5 class="modal-title">Jump to Page</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="number" name="page" class="form-control" placeholder="Page number">
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Go</button>
                </div>
            </form>
        </div>
    </div>
</div>
