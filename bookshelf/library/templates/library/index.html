{% extends 'base.html' %}

{% block head_title %}Bookshelf{% endblock %}

{% block content %}
<div class="container py-4"> 
    <div class="row justify-content-center">
        <div class="col-12">
            <!-- Search Form -->
            <section class="mb-5">
                <h2 class="h4 mb-3 text-dark">Search</h2>
                <form 
                    hx-get="{% url 'library:home' %}" 
                    hx-target="#search-results" 
                    hx-push-url="true"
                    hx-trigger="submit"
                    class="d-flex gap-2"
                >
                    <div class="input-group">
                        <input 
                            type="text" 
                            name="q"
                            class="form-control" 
                            placeholder="Search authors, series, or books..." 
                            value="{{ query|default:'' }}"
                            autocomplete="off"
                        >
                        <button 
                            class="btn btn-outline-secondary" 
                            type="button" 
                            id="clear-search"
                            hx-get="{% url 'library:home' %}"
                            hx-target="#search-results"
                            hx-vals='{"q": ""}'
                            hx-push-url="true"
                            hx-on::after-request="document.querySelector('input[name=q]').value = ''"
                        >
                            &times;
                        </button>
                    </div>
                    <button class="btn btn-primary" type="submit">Search</button>
                </form>
                <div id="search-results" class="mt-3">
                    {% include 'library/include/search_results.html' %}
                </div>
            </section>

            <div id="main-content">
                {% partialdef latest_arrivals inline %}
                    {% include 'library/include/_home_main_content.html' %}
                {% endpartialdef %}
            </div>
        </div>
    </div>
</div>
{% endblock content %}
