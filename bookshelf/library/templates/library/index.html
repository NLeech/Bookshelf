{% extends 'base.html'  %}

{% block head_title %}Bookshelf{% endblock %}

{% block content %}

   <!-- Search Bar -->
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <form method="get" action="{% url 'library:home' %}" class="d-flex">
                    {% csrf_token %}
                    <input type="text" class="form-control me-2" name="q" placeholder="Search books..." required>
                    <button class="btn btn-primary" type="submit">Search</button>
                </form>
            </div>
        </div>
    </div>

{% endblock content %}
